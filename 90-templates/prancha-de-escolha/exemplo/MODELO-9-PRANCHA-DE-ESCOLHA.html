<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MODELO 9 · Prancha de escolha · amostra</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet"><style>:root{--noite:#0A0907;--carvao:#16130F;--borda:#2A251E;--pedra:#8A8378;--osso:#EFE9DD;--luz:#E9A23B}
*{box-sizing:border-box}body{margin:0;background:var(--noite);color:var(--osso);font:15px/1.45 'Instrument Sans',sans-serif;padding:32px 16px 64px}
main{max-width:1320px;margin:0 auto}h1{font:400 clamp(34px,6vw,60px)/1 'Instrument Serif',serif;margin:0 0 10px}h1 i{color:var(--luz)}
p.sub{color:var(--pedra);font:13px/1.55 'JetBrains Mono',monospace;max-width:820px}
h2{font:400 30px 'Instrument Serif',serif;border-top:1px solid var(--borda);padding-top:18px;margin:44px 0 14px}
h2 em{font:500 12px 'JetBrains Mono',monospace;color:var(--luz);font-style:normal;margin-right:10px;letter-spacing:.1em}
.g{display:grid;gap:16px}figure{margin:0}img{width:100%;display:block;border:1px solid var(--borda);border-radius:4px}
figcaption{font:12px/1.4 'JetBrains Mono',monospace;color:var(--pedra);margin-top:8px}figcaption b{color:var(--luz);font-weight:500;margin-right:6px}
figcaption span{display:block;margin-top:4px;opacity:.85}
@media(max-width:700px){.g{grid-template-columns:repeat(2,1fr)!important}}</style></head><body><main><h1>MODELO 9 · Prancha de escolha · <i>amostra</i></h1><p class="sub">Quando usar: degrau 5 do desenho de produto, kit de marca, direção de arte. · Conta de exemplo: Oficina Alvorada. Uma variável por linha, de 2 a 4 opções; a recomendação vai na mensagem, não na prancha.</p><h2><em>1</em> Escolha a paleta</h2><div class="g" style="grid-template-columns:repeat(3,1fr)"><figure><img loading="lazy" src="opcoes/paleta-a.svg" alt="A"><figcaption><b>A</b>noite e laranja: contraste alto, lê de longe no story<span>mudar: a cor do botão</span></figcaption></figure><figure><img loading="lazy" src="opcoes/paleta-b.svg" alt="B"><figcaption><b>B</b>musgo e menta: mais calma, puxa para revisão e cuidado</figcaption></figure><figure><img loading="lazy" src="opcoes/paleta-c.svg" alt="C"><figcaption><b>C</b>grafite e vermelho: urgência, puxa para freio e conserto</figcaption></figure></div><h2><em>2</em> Escolha a letra do título</h2><div class="g" style="grid-template-columns:repeat(3,1fr)"><figure><img loading="lazy" src="opcoes/titulo-a.svg" alt="A"><figcaption><b>A</b>condensada: cabe mais palavra na tela do story</figcaption></figure><figure><img loading="lazy" src="opcoes/titulo-b.svg" alt="B"><figcaption><b>B</b>serifada: mais formal, pesa na proposta de frota</figcaption></figure><figure><img loading="lazy" src="opcoes/titulo-c.svg" alt="C"><figcaption><b>C</b>sem serifa: neutra, a mesma do WhatsApp</figcaption></figure></div></main></body></html>
